<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ALBUM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: #f6f1e7;
}

header {
  text-align: center;
  padding: 30px;
  display: none; /* Ẩn khi chưa đăng nhập */
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 40px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.login-box {
  max-width: 400px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
}

input, button {
  padding: 10px;
  font-size: 16px;
  margin-top: 10px;
}

button {
  background: #c9b27c;
  border: none;
  color: white;
  border-radius: 12px;
  cursor: pointer;
}

.cover img {
  width: 100%;
  border-radius: 20px;
  margin-bottom: 30px;
}

.album-item {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 15px;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.album-item span {
  font-size: 22px;
  font-family: 'Playfair Display', serif;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.gallery img {
  width: 100%;
  border-radius: 18px;
  cursor: pointer;
}

.back {
  cursor: pointer;
  margin-bottom: 20px;
  font-size: 18px;
}

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
}

#overlay img {
  max-width: 90%;
  max-height: 90%;
}

#close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: white;
  font-size: 32px;
  cursor: pointer;
}
</style>
</head>

<body>

<header id="pageHeader">
  <h1>ALBUM</h1>
</header>

<div class="container">

  <div class="login-box" id="loginBox">
    <h3>Nhập mật khẩu</h3>
    <input type="password" id="password" placeholder="Mật khẩu">
    <br>
    <button onclick="login()">Truy cập</button>
  </div>

  <div id="home" style="display:none"></div>
  <div id="albumView" style="display:none"></div>

</div>

<div id="overlay" onclick="closeImage()">
  <span id="close">✕</span>
  <img id="overlayImg">
</div>

<script>
const PASSWORD = "giadinh";
let albumsData = [];

function login() {
  if (password.value === PASSWORD) {
    loginBox.style.display = "none";
    pageHeader.style.display = "block"; // hiện tiêu đề
    home.style.display = "block";
    loadHome();
  } else {
    alert("Sai mật khẩu");
  }
}

function loadHome() {
  fetch("data.json")
    .then(res => res.json())
    .then(data => {
      albumsData = data.albums;
      home.innerHTML = `
        <div class="cover">
          <img src="${data.cover}">
        </div>
      `;
      data.albums.forEach((a, i) => {
        const div = document.createElement("div");
        div.className = "album-item";
        div.innerHTML = `<span>${a.title}</span><span>›</span>`;
        div.onclick = () => openAlbum(i);
        home.appendChild(div);
      });
    });
}

function openAlbum(index) {
  home.style.display = "none";
  albumView.style.display = "block";

  const album = albumsData[index];
  albumView.innerHTML = `
    <div class="back" onclick="goBack()">← Quay lại</div>
    <h2>${album.title}</h2>
    <div class="gallery">
      ${album.photos.map(p =>
        `<img src="${p}" onclick="showImage('${p}')">`
      ).join("")}
    </div>
  `;
}

function goBack() {
  albumView.style.display = "none";
  home.style.display = "block";
}

function showImage(src) {
  overlayImg.src = src;
  overlay.style.display = "flex";
}

function closeImage() {
  overlay.style.display = "none";
}
</script>

</body>
</html>
