<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Album Gia Đình</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: #faf7f2;
  color: #333;
}

header {
  text-align: center;
  padding: 30px 20px;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.login-box {
  background: #fff;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  max-width: 400px;
  margin: 40px auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

button {
  padding: 10px 20px;
  border-radius: 12px;
  border: none;
  background: #c9b27c;
  color: #fff;
  cursor: pointer;
  font-size: 16px;
}

input {
  padding: 10px;
  width: 80%;
  font-size: 16px;
  margin-top: 10px;
}

.cover img {
  width: 100%;
  border-radius: 20px;
  margin-bottom: 40px;
}

.album-title {
  font-size: 28px;
  margin: 20px 0;
  font-family: 'Playfair Display', serif;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.photo img {
  width: 100%;
  border-radius: 18px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

#overlay img {
  max-width: 90%;
  max-height: 90%;
}

#close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: white;
  font-size: 32px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h1>Album Gia Đình</h1>
</header>

<div class="container">

  <div class="login-box" id="loginBox">
    <h3>Nhập mật khẩu</h3>
    <input type="password" id="password">
    <br><br>
    <button onclick="login()">Truy cập</button>
  </div>

  <div id="content" style="display:none"></div>

</div>

<div id="overlay" onclick="closeImage()">
  <span id="close">✕</span>
  <img id="overlayImg">
</div>

<script>
const PASSWORD = "giadinh";

function login() {
  if (document.getElementById("password").value === PASSWORD) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("content").style.display = "block";
    loadData();
  } else alert("Sai mật khẩu");
}

function loadData() {
  fetch("data.json")
    .then(res => res.json())
    .then(data => {
      const content = document.getElementById("content");

      // cover
      const cover = document.createElement("div");
      cover.className = "cover";
      cover.innerHTML = `<img src="${data.cover}">`;
      content.appendChild(cover);

      // albums
      data.albums.forEach(album => {
        const title = document.createElement("div");
        title.className = "album-title";
        title.textContent = album.title;
        content.appendChild(title);

        const gallery = document.createElement("div");
        gallery.className = "gallery";

        album.photos.forEach(src => {
          const div = document.createElement("div");
          div.className = "photo";
          div.innerHTML = `<img src="${src}" onclick="showImage('${src}')">`;
          gallery.appendChild(div);
        });

        content.appendChild(gallery);
      });
    });
}

function showImage(src) {
  document.getElementById("overlayImg").src = src;
  document.getElementById("overlay").style.display = "flex";
}

function closeImage() {
  document.getElementById("overlay").style.display = "none";
}
</script>

</body>
</html>
