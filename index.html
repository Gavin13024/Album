<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Album Gia Đình</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: #f6f1e7;
}

header {
  text-align: center;
  padding: 30px;
  display: none;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 40px;
}

/* ===== CONTAINER ===== */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* ===== LOGIN ===== */
.login-box {
  max-width: 400px;
  margin: 80px auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

input, button {
  padding: 12px;
  font-size: 16px;
  margin-top: 12px;
}

button {
  background: #c9b27c;
  border: none;
  color: white;
  border-radius: 14px;
  cursor: pointer;
}

/* ===== YEAR LIST ===== */
.year-item {
  background: white;
  padding: 26px;
  border-radius: 18px;
  margin-bottom: 20px;
  font-size: 28px;
  font-family: 'Montserrat', sans-serif; /* FONT MỚI */
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ===== TIMELINE ===== */
.back {
  cursor: pointer;
  font-size: 18px;
  margin-bottom: 20px;
}

.event {
  background: white;
  padding: 25px;
  border-radius: 20px;
  margin-bottom: 30px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

.event-date {
  font-weight: 600;
  color: #8a7b55;
  margin-bottom: 6px;
}

.event-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  margin-bottom: 16px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.gallery img {
  width: 100%;
  border-radius: 16px;
  cursor: pointer;
}

/* ===== IMAGE VIEW ===== */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
}

#overlay img {
  max-width: 90%;
  max-height: 90%;
}

#close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: white;
  font-size: 32px;
  cursor: pointer;
}
</style>
</head>

<body>

<header id="pageHeader">
  <h1 id="headerTitle">Album Gia Đình</h1>
</header>

<div class="container">

  <div class="login-box" id="loginBox">
    <h3>Nhập mật khẩu</h3>
    <input type="password" id="password">
    <br>
    <button onclick="login()">Truy cập</button>
  </div>

  <div id="home" style="display:none"></div>
  <div id="yearView" style="display:none"></div>

</div>

<div id="overlay" onclick="closeImage()">
  <span id="close">✕</span>
  <img id="overlayImg">
</div>

<script>
const PASSWORD = "giadinh";
let yearsData = [];

function login() {
  if (password.value === PASSWORD) {
    loginBox.style.display = "none";
    pageHeader.style.display = "block";
    headerTitle.innerText = "Album Gia Đình";
    home.style.display = "block";
    loadHome();
  } else alert("Sai mật khẩu");
}

function loadHome() {
  fetch("data.json")
    .then(r => r.json())
    .then(data => {
      yearsData = data.years;
      home.innerHTML = "";
      yearsData.forEach((y, i) => {
        const div = document.createElement("div");
        div.className = "year-item";
        div.innerHTML = `<span>${y.year}</span><span>›</span>`;
        div.onclick = () => openYear(i);
        home.appendChild(div);
      });
    });
}

function openYear(index) {
  home.style.display = "none";
  yearView.style.display = "block";

  const year = yearsData[index];
  headerTitle.innerText = `Năm ${year.year}`; // 🔥 ĐỔI TIÊU ĐỀ

  yearView.innerHTML = `
    <div class="back" onclick="goBack()">← Quay lại</div>
    ${year.events.map(e => `
      <div class="event">
        <div class="event-date">${e.date}</div>
        <div class="event-title">${e.title}</div>
        <div class="gallery">
          ${e.photos.map(p =>
            `<img src="${p}" onclick="showImage('${p}')">`
          ).join("")}
        </div>
      </div>
    `).join("")}
  `;
}

function goBack() {
  yearView.style.display = "none";
  home.style.display = "block";
  headerTitle.innerText = "Album Gia Đình"; // 🔁 TRẢ VỀ
}

function showImage(src) {
  overlayImg.src = src;
  overlay.style.display = "flex";
}

function closeImage() {
  overlay.style.display = "none";
}
</script>

</body>
</html>
