<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Album Gia Đình</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: #f6f1e7;
}

/* ===== LOGIN ===== */
#loginPage {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  text-align: center;
}

input, button {
  padding: 10px;
  font-size: 16px;
  margin-top: 10px;
}

button {
  background: #c9b27c;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* ===== HOME ===== */
#homePage {
  display: none;
  height: 100vh;
  display: grid;
  grid-template-columns: 350px 1fr;
}

/* LEFT */
.left {
  padding: 40px;
  background: #f6f1e7;
  position: relative;
}

.left::after {
  content: "";
  position: absolute;
  top: 0;
  right: -1px;
  width: 100px;
  height: 100%;
  background: linear-gradient(to right, #f6f1e7 0%, rgba(246,241,231,0) 100%);
  pointer-events: none;
}

.album-wrapper {
  margin-top: 120px;
  max-width: 240px;
  margin-left: auto;
  margin-right: auto;
}

.album-title {
  font-size: 26px;
  margin-bottom: 20px;
}

.year-list div {
  font-size: 20px;
  padding: 10px 0;
  cursor: pointer;
}

.year-list div:hover {
  text-decoration: underline;
}

/* RIGHT */
.right img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== TIMELINE ===== */
#timelinePage {
  display: none;
  padding: 40px;
}

.back {
  cursor: pointer;
  margin-bottom: 20px;
  font-size: 18px;
}

.event {
  margin-bottom: 50px;
}

.event-date {
  font-weight: 600;
  color: #8a7a4f;
}

.event-title {
  font-size: 24px;
  margin: 5px 0 15px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 15px;
}

.gallery img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
}

/* FULLSCREEN */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
}

#overlay img {
  max-width: 90%;
  max-height: 90%;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <h3>Nhập mật khẩu</h3>
    <input type="password" id="passwordInput">
    <br>
    <button onclick="doLogin()">Truy cập</button>
  </div>
</div>

<!-- HOME -->
<div id="homePage">
  <div class="left">
    <div class="album-wrapper">
      <div class="album-title">Năm</div>
      <div class="year-list" id="yearList"></div>
    </div>
  </div>
  <div class="right">
    <img id="coverImg">
  </div>
</div>

<!-- TIMELINE -->
<div id="timelinePage"></div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeImage()">
  <img id="overlayImg">
</div>

<script>
const PASSWORD = "giadinh";

const loginPage = document.getElementById("loginPage");
const homePage = document.getElementById("homePage");
const timelinePage = document.getElementById("timelinePage");
const yearList = document.getElementById("yearList");
const coverImg = document.getElementById("coverImg");

const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");

let years = [];

/* LOGIN */
function doLogin() {
  if (passwordInput.value === PASSWORD) {
    loginPage.style.display = "none";
    homePage.style.display = "grid";
    loadData();
  } else {
    alert("Sai mật khẩu");
  }
}

/* LOAD DATA */
function loadData() {
  fetch("data.json")
    .then(res => res.json())
    .then(data => {
      coverImg.src = data.cover;
      years = data.years;

      yearList.innerHTML = "";
      years.forEach((y, i) => {
        const div = document.createElement("div");
        div.innerText = y.year;
        div.onclick = () => openYear(i);
        yearList.appendChild(div);
      });
    });
}

/* OPEN YEAR */
function openYear(index) {
  homePage.style.display = "none";
  timelinePage.style.display = "block";

  const year = years[index];

  timelinePage.innerHTML = `
    <div class="back" onclick="goBack()">← Quay lại</div>
    <h1>${year.year}</h1>
    ${year.events.map(e => `
      <div class="event">
        <div class="event-date">${e.date}</div>
        <div class="event-title">${e.title}</div>
        <div class="gallery">
          ${e.photos.map(p => `<img src="${p}" onclick="showImage('${p}')">`).join("")}
        </div>
      </div>
    `).join("")}
  `;
}

/* BACK */
function goBack() {
  timelinePage.style.display = "none";
  homePage.style.display = "grid";
}

/* FULLSCREEN */
function showImage(src) {
  overlayImg.src = src;
  overlay.style.display = "flex";
}

function closeImage() {
  overlay.style.display = "none";
}
</script>

</body>
</html>
