<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Album Gia Đình</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(180deg, #f6f1e7, #fffdf8);
  color: #333;
}

header {
  text-align: center;
  padding: 40px 20px;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 40px;
  margin: 0;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.login-box {
  background: #fff;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  max-width: 400px;
  margin: 30px auto;
}

input[type=password] {
  padding: 10px;
  font-size: 16px;
  width: 80%;
  margin-top: 10px;
}

button {
  margin-top: 15px;
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  background: #c9b27c;
  color: #fff;
  cursor: pointer;
}

.gallery {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.photo {
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  cursor: pointer;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

#overlay img {
  max-width: 90%;
  max-height: 90%;
}

#closeBtn {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 32px;
  color: #fff;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h1>Album Gia Đình</h1>
</header>

<div class="container">

  <div class="login-box" id="loginBox">
    <h3>Nhập mật khẩu để xem ảnh</h3>
    <input type="password" id="password" placeholder="Mật khẩu">
    <br>
    <button onclick="login()">Truy cập</button>
  </div>

  <div class="gallery" id="gallery"></div>

</div>

<div id="overlay" onclick="closeImage()">
  <span id="closeBtn">✕</span>
  <img id="overlayImg">
</div>

<script>
const PASSWORD = "giadinh";

function login() {
  const input = document.getElementById("password").value;
  if (input === PASSWORD) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("gallery").style.display = "grid";
    loadImages();
  } else {
    alert("Sai mật khẩu!");
  }
}

function loadImages() {
  fetch("images.json")
    .then(res => res.json())
    .then(images => {
      const gallery = document.getElementById("gallery");
      images.forEach(src => {
        const div = document.createElement("div");
        div.className = "photo";
        const img = document.createElement("img");
        img.src = src;
        img.onclick = () => showImage(src);
        div.appendChild(img);
        gallery.appendChild(div);
      });
    });
}

function showImage(src) {
  document.getElementById("overlayImg").src = src;
  document.getElementById("overlay").style.display = "flex";
}

function closeImage() {
  document.getElementById("overlay").style.display = "none";
}
</script>

</body>
</html>
